            expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>',
            collapse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>',
            file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>',
            video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
            audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
            archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>',
            trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg>'
        };

        function escapeAttr(value) {
            return String(value).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function clearTouchActions(exceptToolbar = null) {
            document.querySelectorAll('.msg-actions.touch-visible').forEach((toolbar) => {
                if (toolbar !== exceptToolbar) toolbar.classList.remove('touch-visible');
            });
        }

        function revealTouchActions(toolbar) {
            if (!touchActionsQuery.matches || !toolbar) return;
            clearTouchActions(toolbar);
            toolbar.classList.add('touch-visible');
        }

        function getMessageType(msg) {
            if (msg?.message_type) return msg.message_type;
            if (msg?.dataset?.messageType) return msg.dataset.messageType;
            if ((msg?.content || msg?.dataset?.content) === CLEANUP_PLACEHOLDER) return 'system';
            if (msg?.file_url || msg?.dataset?.hasFile === 'true') return 'file';
            return 'text';
        }

        function isCleanupEligibleMessage(msg) {
            const t = getMessageType(msg);
            return t === 'file' || t === 'image_group';
        }

        function isFavoritableMessage(msg) {
            const id = Number(msg?.id ?? msg?.dataset?.messageId);
            return Number.isInteger(id) && id > 0 && getMessageType(msg) === 'text';
        }

        // Hash-based color for IP avatars
        const AVATAR_PALETTE = [
            ['#2563eb', '#14b8a6'], ['#0f766e', '#22c55e'], ['#f59e0b', '#ef4444'],
            ['#10b981', '#14b8a6'], ['#06b6d4', '#3b82f6'], ['#475569', '#0f172a'],
            ['#0ea5e9', '#2563eb'], ['#22c55e', '#84cc16'], ['#f97316', '#f59e0b']
        ];
        function hashStr(s) {
            let h = 0;
            const str = String(s || '');
            for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
            return Math.abs(h);
        }
        function ipPalette(ip) {
            return AVATAR_PALETTE[hashStr(ip) % AVATAR_PALETTE.length];
        }
        function ipAvatarLabel(ip) {
            const text = String(ip || '').replace(/^::ffff:/, '').trim();
            if (!text) return '?';
            const parts = text.split('.');
            if (parts.length === 4) return parts[3].slice(0, 2).toUpperCase().padStart(2, '0');
            return text.slice(0, 2).toUpperCase();
        }

        function shouldCollapseText(content) {
            const s = String(content || '');
            return s.length > LONG_TEXT_CHARS || s.split(/\r?\n/).length > LONG_TEXT_LINES;
        }

        function formatTime(ts) {
            return normalizeTimestamp(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        function formatDateTime(ts) {
            return normalizeTimestamp(ts).toLocaleString([], { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        }
        function normalizeTimestamp(ts) {
            if (ts instanceof Date) return ts;
            const safe = typeof ts === 'string' ? ts.replace(' ', 'T') : ts;
            const p = new Date(safe || Date.now());
            return Number.isNaN(p.getTime()) ? new Date() : p;
        }
        function extractFileName(content) {
            return (content || '').replace(/^\[文件\]\s*/, '') || '文件';
        }
        function fileTypeIcon(mime, name) {
            const m = String(mime || '').toLowerCase();
            const n = String(name || '').toLowerCase();
            if (m.startsWith('video/')) return ICON.video;
            if (m.startsWith('audio/')) return ICON.audio;
            if (m.includes('zip') || m.includes('compressed') || m.includes('tar') || /\.(zip|rar|7z|tar|gz|bz2)$/.test(n)) return ICON.archive;
            return ICON.file;
        }

        // === Day separator helpers ===
        function dayLabel(date) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(date);
            target.setHours(0, 0, 0, 0);
            const diffDays = Math.round((today - target) / 86400000);
            if (diffDays === 0) return '今天';
            if (diffDays === 1) return '昨天';
            if (diffDays < 7) return `${diffDays} 天前`;
            return target.toLocaleDateString([], { month: 'long', day: 'numeric' });
        }
        function dayKey(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d.toISOString().slice(0, 10);
        }
        function makeDaySeparator(date) {
            const el = document.createElement('div');
            el.className = 'day-separator';
            el.dataset.dayKey = dayKey(date);
            el.textContent = dayLabel(date);
            return el;
        }
        function updateDateSeparators() {
            const seps = Array.from(messagesDiv.querySelectorAll('.day-separator'));
            seps.forEach((sep) => {
                let sibling = sep.nextElementSibling;
                let hasVisible = false;
                while (sibling && !sibling.classList.contains('day-separator')) {
                    if (sibling.classList.contains('message') && sibling.style.display !== 'none') {
                        hasVisible = true;
                        break;
                    }
                    sibling = sibling.nextElementSibling;
                }
                sep.style.display = hasVisible ? '' : 'none';
            });
        }

        // === Filter bar ===
        let activeFilter = 'all';
        const filterChips = document.querySelectorAll('.filter-chip');
        function applyFilter(filter) {
            activeFilter = filter;
            filterChips.forEach((c) => {
                const a = c.dataset.filter === filter;
                c.classList.toggle('active', a);
                c.setAttribute('aria-selected', String(a));
            });
            document.querySelectorAll('.message').forEach((el) => {
                const t = el.dataset.messageType;
                let match = true;
                if (filter === 'text') match = t === 'text';
                else if (filter === 'image') {
                    match = t === 'image_group' || (t === 'file' && Number(el.dataset.imageCount || 0) > 0);
                } else if (filter === 'file') {
                    match = t === 'file' && Number(el.dataset.fileCount || 0) > 0;
                }
                el.style.display = match ? '' : 'none';
            });
            updateDateSeparators();
        }
        filterChips.forEach((c) => c.addEventListener('click', () => applyFilter(c.dataset.filter)));

        // === Topbar stats ===
        function updateTopbarStats() {
            if (!topbarStats) return;
            const today = new Date().toLocaleDateString();
            let msgCount = 0, imgCount = 0, fileCount = 0;
            messagesDiv.querySelectorAll('.message').forEach((el) => {
                if (el.dataset.day !== 'today') return;
                const mt = el.dataset.messageType;
                if (mt === 'system') return;
                msgCount += 1;
                imgCount += Number(el.dataset.imageCount || 0);
                fileCount += Number(el.dataset.fileCount || 0);
            });
            if (msgCount === 0) {
                topbarStats.textContent = '今天还没有消息 · 拖入或粘贴开始';
            } else {
                const parts = [`今天 ${msgCount} 条`];
                if (imgCount > 0) parts.push(`${imgCount} 张图片`);
                if (fileCount > 0) parts.push(`${fileCount} 个文件`);
                topbarStats.textContent = parts.join(' · ');
            }
        }

        // === Socket events ===
        socket.on('connect', () => updateConnStatus(true));
        socket.on('disconnect', () => updateConnStatus(false));
        socket.io.on('reconnect_attempt', () => updateConnStatus(false, '尝试重连…'));

        socket.on('history', (history) => {
            isHistoryHydrating = true;
            expandedImageGroupIds.clear();
            expandedTextMessageIds.clear();
            messagesDiv.innerHTML = '';

            if (!Array.isArray(history) || !history.length) {
                renderEmptyState();
            } else {
                const fragment = document.createDocumentFragment();
                let lastDayKey = null;
                history.forEach((msg) => {
                    const ts = normalizeTimestamp(msg.timestamp);
                    const k = dayKey(ts);
                    if (k !== lastDayKey) {
                        fragment.appendChild(makeDaySeparator(ts));
                        lastDayKey = k;
                    }
                    fragment.appendChild(createMessageElement(msg, { smoothMediaScroll: false }));
                });
                messagesDiv.appendChild(fragment);
            }
            scrollToBottom(false);
            requestAnimationFrame(() => { isHistoryHydrating = false; updateTopbarStats(); applyFilter(activeFilter); });
        });

        socket.on('chat message', (msg) => {
            identifySelfFromEcho(msg);
            removeEmptyState();
            appendMessage(msg);
            scrollToBottom(true);
            updateTopbarStats();
        });

        socket.on('system cleanup', () => {
            document.querySelectorAll('.message[data-cleanup-eligible="true"]').forEach((el) => markMessageAsCleaned(el));
            scrollToBottom(true);
            updateTopbarStats();
        });

        socket.on('history cleared', () => {
            expandedImageGroupIds.clear();
            expandedTextMessageIds.clear();
            messagesDiv.innerHTML = '';
            renderEmptyState();
            updateTopbarStats();
        });

        socket.on('message deleted', ({ id }) => {
            const el = messagesDiv.querySelector(`.message[data-message-id="${id}"]`);
            if (el) el.remove();
            expandedImageGroupIds.delete(Number(id));
            expandedTextMessageIds.delete(Number(id));
            updateDateSeparators();
            updateTopbarStats();
            if (!messagesDiv.querySelector('.message')) renderEmptyState();
        });

        socket.on('favorites updated', () => fetchFavorites());

        // === Connection status ===
        function updateConnStatus(online, customLabel) {
            const ipText = myIp ? myIp : '未识别本机 IP';
            connCard.classList.toggle('offline', !online);
            connStatusEl.textContent = customLabel || (online ? '实时同步中' : '连接已断开');
            connIpEl.textContent = ipText;
            topStatusEl.querySelector('span:last-child').textContent = online ? '已连接' : (customLabel || '已断开');
            topStatusEl.classList.toggle('offline', !online);
            const netBanner = $('net-banner');
            if (netBanner) netBanner.hidden = online;
        }

        // === Empty state ===
        function renderEmptyState() {
            if (messagesDiv.querySelector('.empty-state')) return;
            const wrap = document.createElement('div');
            wrap.className = 'empty-state';
            wrap.innerHTML = `
                <div class="empty-state-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <h3>开始投递</h3>
                <p>输入文字、拖入文件、或者直接 <kbd>⌘V</kbd> 粘贴截图。同一局域网下的所有设备会实时同步。</p>
            `;
            messagesDiv.appendChild(wrap);
        }
        function removeEmptyState() {
            const empty = messagesDiv.querySelector('.empty-state');
            if (empty) empty.remove();
        }

        // === Message rendering ===
        function createMessageElement(msg, options = {}) {
            const messageEl = document.createElement('article');
            const messageType = getMessageType(msg);
            const canFavorite = isFavoritableMessage(msg);

            messageEl.className = 'message';
            messageEl.dataset.messageId = msg.id ? String(msg.id) : '';
            messageEl.dataset.ip = msg.ip || '';
            messageEl.dataset.content = msg.content || '';
            messageEl.dataset.time = formatTime(msg.timestamp);
            messageEl.dataset.dateTime = formatDateTime(msg.timestamp);
            messageEl.dataset.system = messageType === 'system' ? 'true' : 'false';
            messageEl.dataset.hasFile = msg.file_url ? 'true' : 'false';
            messageEl.dataset.favoriteEligible = canFavorite ? 'true' : 'false';
            messageEl.dataset.cleanupEligible = isCleanupEligibleMessage(msg) ? 'true' : 'false';
            messageEl.dataset.messageType = messageType;

            const msgDate = normalizeTimestamp(msg.timestamp);
            messageEl.dataset.day = msgDate.toLocaleDateString() === new Date().toLocaleDateString() ? 'today' : 'older';
            messageEl.dataset.timeIso = msgDate.toISOString();
            if (messageType === 'image_group') {
                messageEl.dataset.imageCount = String(Array.isArray(msg.group_items) ? msg.group_items.length : 0);
                messageEl.dataset.fileCount = '0';
            } else if (messageType === 'file') {
                if (String(msg.file_type || '').startsWith('image/')) {
                    messageEl.dataset.imageCount = '1';
                    messageEl.dataset.fileCount = '0';
                } else {
                    messageEl.dataset.imageCount = '0';
                    messageEl.dataset.fileCount = '1';
                }
            } else {
                messageEl.dataset.imageCount = '0';
                messageEl.dataset.fileCount = '0';
            }

            if (messageType === 'system') {
                const body = document.createElement('div');
                body.className = 'msg-body';
                const wrap = document.createElement('div');
                wrap.className = 'msg-bubble-wrap';
                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble';
                bubble.textContent = msg.content || CLEANUP_PLACEHOLDER;
                wrap.appendChild(bubble);
                body.appendChild(wrap);
                messageEl.appendChild(body);
                applyMessageTone(messageEl);
                return messageEl;
            }

            // avatar
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            const palette = ipPalette(msg.ip);
            avatar.style.background = `linear-gradient(135deg, ${palette[0]} 0%, ${palette[1]} 100%)`;
            avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>';
            avatar.title = msg.ip || '';
            messageEl.appendChild(avatar);

            // body (info + bubble + actions)
            const body = document.createElement('div');
            body.className = 'msg-body';

            const info = document.createElement('div');
            info.className = 'msg-info';
            const nameEl = document.createElement('strong');
            const timeEl = document.createElement('span');
            info.appendChild(nameEl);
            info.appendChild(timeEl);
            body.appendChild(info);

            const wrap = document.createElement('div');
            wrap.className = 'msg-bubble-wrap';

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            const actions = [];

            if (messageType === 'image_group') {
                bubble.classList.add('media-bubble');
                bubble.appendChild(createImageGroupNode(msg));
                actions.push(createToggleGroupAction(msg.id));
                actions.push(createGroupDownloadAction(msg));
                actions.push(createDeleteAction(msg.id));
            } else if (messageType === 'file') {
                bubble.appendChild(createFileNode(msg, options));
                if (!String(msg.file_type || '').startsWith('image/') && !String(msg.file_type || '').startsWith('video/')) {
                    // file-card branch keeps default padding
                } else {
                    bubble.classList.add('media-bubble');
                }
                actions.push(createDownloadAction(msg));
                actions.push(createDeleteAction(msg.id));
            } else {
                bubble.appendChild(createTextMessageNode(msg));
                bubble.addEventListener('click', async (e) => {
                    if (e.target.closest('button, a')) return;
                    const sel = window.getSelection();
                    if (sel && sel.toString().length > 0 && bubble.contains(sel.anchorNode)) return;
                    const ok = await copyText(messageEl.dataset.content || '');
                    showToast(ok ? '已复制消息内容' : '复制失败，请重试');
                });
                if (canFavorite) actions.push(createFavoriteAction(msg.id));
                actions.push(createDeleteAction(msg.id));
            }

            wrap.appendChild(bubble);

            if (actions.length) {
                const toolbar = document.createElement('div');
                toolbar.className = 'msg-actions';
                actions.forEach((a) => toolbar.appendChild(a));
                wrap.appendChild(toolbar);
                wrap.addEventListener('pointerdown', (event) => {
                    if (event.pointerType === 'mouse') return;
                    revealTouchActions(toolbar);
                }, { passive: true });
            }

            body.appendChild(wrap);
            messageEl.appendChild(body);
            applyMessageTone(messageEl);
            return messageEl;
        }

        function applyMessageTone(messageEl) {
            messageEl.classList.remove('self', 'other', 'system');
            const isSystem = messageEl.dataset.system === 'true';
            if (isSystem) {
                messageEl.classList.add('system');
                return;
            }
            const isSelf = Boolean(myIp) && messageEl.dataset.ip === myIp;
            messageEl.classList.add(isSelf ? 'self' : 'other');

            const info = messageEl.querySelector('.msg-info');
            if (info) {
                const nameEl = info.querySelector('strong');
                const timeEl = info.querySelector('span');
                if (nameEl) nameEl.textContent = isSelf ? '我' : (messageEl.dataset.ip || '未知设备');
                if (timeEl) timeEl.textContent = messageEl.dataset.time || '';
            }
        }

        function appendMessage(msg) {
            const ts = normalizeTimestamp(msg.timestamp);
            const newKey = dayKey(ts);
            const lastSep = messagesDiv.querySelector('.day-separator:last-of-type');
            const lastMsg = messagesDiv.querySelector('.message:last-of-type');
            let lastKey = null;
            if (lastSep) lastKey = lastSep.dataset.dayKey || null;
            if (!lastKey && lastMsg) {
                const lastTs = lastMsg.dataset.timeIso;
                if (lastTs) lastKey = dayKey(new Date(lastTs));
            }
            if (newKey !== lastKey) {
                messagesDiv.appendChild(makeDaySeparator(ts));
            }
            const el = createMessageElement(msg, { smoothMediaScroll: true });
            el.dataset.timeIso = ts.toISOString();
            messagesDiv.appendChild(el);
            if (activeFilter !== 'all') {
                applyFilter(activeFilter);
            }
        }

        function refreshOwnership() {
            document.querySelectorAll('.message').forEach(applyMessageTone);
        }

        function markMessageAsCleaned(messageEl) {
            expandedImageGroupIds.delete(Number(messageEl.dataset.messageId));
            expandedTextMessageIds.delete(Number(messageEl.dataset.messageId));

            messageEl.dataset.content = CLEANUP_PLACEHOLDER;
            messageEl.dataset.system = 'true';
            messageEl.dataset.hasFile = 'false';
            messageEl.dataset.favoriteEligible = 'false';
            messageEl.dataset.cleanupEligible = 'false';
            messageEl.dataset.messageType = 'system';

            // Replace contents with system layout
            messageEl.innerHTML = '';
            const body = document.createElement('div');
            body.className = 'msg-body';
            const wrap = document.createElement('div');
            wrap.className = 'msg-bubble-wrap';
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = CLEANUP_PLACEHOLDER;
            wrap.appendChild(bubble);
            body.appendChild(wrap);
            messageEl.appendChild(body);
            applyMessageTone(messageEl);
        }

        // === Action factories ===
        function createMsgAction({ html, title, className = '', onClick }) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `msg-action ${className}`.trim();
            btn.innerHTML = html;
            btn.title = title;
            btn.setAttribute('aria-label', title);
            btn.addEventListener('click', async (event) => {
                event.preventDefault();
                event.stopPropagation();
                await onClick(event, btn);
            });
            return btn;
        }

        function createCopyAction() {
            return createMsgAction({
                html: ICON.copy,
                title: '复制文本',
                onClick: async (e, btn) => {
                    const messageEl = btn.closest('.message');
                    if (!messageEl) return;
                    const ok = await copyText(messageEl.dataset.content || '');
                    showToast(ok ? '已复制消息内容' : '复制失败，请重试');
                }
            });
        }

        function createFavoriteAction(messageId) {
            const btn = createMsgAction({
                html: ICON.star,
                title: '收藏文本',
                className: 'favorite-action',
                onClick: async (e, b) => {
                    const messageEl = b.closest('.message');
                    if (!messageEl) return;
                    await addFavoriteFromMessage(messageEl);
                }
            });
            btn.dataset.sourceMessageId = String(messageId || '');
            updateFavoriteActionState(btn, favoritesBySourceId.has(Number(messageId)));
            return btn;
        }

        function createDownloadAction(msg) {
            return createMsgAction({
                html: ICON.download,
                title: '下载文件',
                onClick: async () => {
                    const ok = await downloadFile(msg.file_url, extractFileName(msg.content));
                    showToast(ok ? '开始下载文件' : '下载失败，请重试');
                }
            });
        }

        function createToggleGroupAction(messageId) {
            const btn = createMsgAction({
                html: ICON.expand,
                title: '展开图片组',
                className: 'toggle-group-action',
                onClick: async (e, b) => {
                    const messageEl = b.closest('.message');
                    if (!messageEl) return;
                    toggleImageGroupExpanded(messageEl);
                }
            });
            updateImageGroupToggleAction(btn, expandedImageGroupIds.has(Number(messageId)));
            return btn;
        }

        function createGroupDownloadAction(msg) {
            return createMsgAction({
                html: ICON.download,
                title: '下载本组图片',
                onClick: async () => {
                    await downloadGroupItems(Array.isArray(msg.group_items) ? msg.group_items : []);
                }
            });
        }

        function createDeleteAction(messageId) {
            return createMsgAction({
                html: ICON.trash,
                title: '删除消息',
                className: 'delete-action',
                onClick: async () => {
                    const ok = await openConfirm({
                        title: '删除这条消息？',
                        desc: '该消息将从所有设备移除。如果是文件或图片组，对应物理文件也会一并删除。收藏夹不受影响。',
                        danger: true,
                        confirmText: '删除'
                    });
                    if (!ok) return;
                    try {
                        const res = await fetch(`/api/messages/${messageId}`, { method: 'DELETE' });
                        if (!res.ok) throw new Error('Failed');
                        showToast('消息已删除');
                    } catch (e) { showToast('删除失败，请重试'); }
                }
            });
        }

        function updateFavoriteActionState(btn, isActive) {
            btn.classList.toggle('active', isActive);
            btn.innerHTML = isActive ? ICON.starFill : ICON.star;
            btn.setAttribute('aria-pressed', String(isActive));
            const label = isActive ? '已收藏' : '收藏文本';
            btn.title = label;
            btn.setAttribute('aria-label', label);
        }

        function updateImageGroupToggleAction(btn, expanded) {
            btn.classList.toggle('active', expanded);
            btn.innerHTML = expanded ? ICON.collapse : ICON.expand;
            btn.setAttribute('aria-pressed', String(expanded));
            const label = expanded ? '收起图片组' : '展开图片组';
            btn.title = label;
            btn.setAttribute('aria-label', label);
        }

        // === Content nodes ===
        function createTextMessageNode(msg) {
            const container = document.createElement('div');
            const collapse = document.createElement('div');
            const textNode = document.createElement('div');
            const willCollapse = shouldCollapseText(msg.content || '');
            const isExpanded = expandedTextMessageIds.has(Number(msg.id));

            collapse.className = 'text-collapse';
            collapse.classList.toggle('collapsed', willCollapse && !isExpanded);
            textNode.className = 'msg-text';
            textNode.textContent = msg.content || '';
            collapse.appendChild(textNode);
            container.appendChild(collapse);

            if (willCollapse) {
                const toggle = document.createElement('button');
                toggle.type = 'button';
                toggle.className = 'text-expand-toggle';
                toggle.textContent = isExpanded ? '收起全文' : '展开全文';
                toggle.setAttribute('aria-expanded', String(isExpanded));
                toggle.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const messageEl = toggle.closest('.message');
                    if (!messageEl) return;
                    toggleTextMessageExpanded(messageEl);
                });
                container.appendChild(toggle);
            }
            return container;
        }

        function toggleTextMessageExpanded(messageEl) {
            const id = Number(messageEl.dataset.messageId);
            if (!Number.isInteger(id) || id <= 0) return;
            const next = !expandedTextMessageIds.has(id);
            if (next) expandedTextMessageIds.add(id); else expandedTextMessageIds.delete(id);
            const c = messageEl.querySelector('.text-collapse');
            if (c) c.classList.toggle('collapsed', !next);
            const t = messageEl.querySelector('.text-expand-toggle');
            if (t) {
                t.textContent = next ? '收起全文' : '展开全文';
                t.setAttribute('aria-expanded', String(next));
            }
        }

        function createFileNode(msg, options = {}) {
            const type = msg.file_type || '';
            const smoothMediaScroll = options.smoothMediaScroll !== false;

            if (type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = msg.file_url;
                img.loading = 'lazy';
                img.decoding = 'async';
                img.alt = extractFileName(msg.content);
                img.addEventListener('click', () => openLightbox([{ file_url: msg.file_url, file_name: extractFileName(msg.content) }], 0));
                bindMediaAutoScroll(img, 'load', smoothMediaScroll);
                return img;
            }
            if (type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = msg.file_url;
                video.controls = true;
                video.preload = 'metadata';
                bindMediaAutoScroll(video, 'loadedmetadata', smoothMediaScroll);
                return video;
            }

            // generic file card
            const fileName = extractFileName(msg.content);
            const card = document.createElement('a');
            card.className = 'file-card';
            card.href = msg.file_url;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            card.innerHTML = `
                <span class="file-icon">${fileTypeIcon(type, fileName)}</span>
                <span class="file-info">
                    <span class="file-name">${escapeAttr(fileName)}</span>
                    <span class="file-meta">${escapeAttr(type || '文件')} · 点击下载</span>
                </span>
            `;
            return card;
        }

        function createImageGroupNode(msg) {
            const groupItems = Array.isArray(msg.group_items) ? msg.group_items : [];
            const container = document.createElement('div');
            const isExpanded = expandedImageGroupIds.has(Number(msg.id));

            container.className = 'image-group';
            container.classList.toggle('expanded', isExpanded);

            const summary = document.createElement('button');
            summary.type = 'button';
            summary.className = 'image-group-summary';

                const img = document.createElement('img');

                img.loading = 'lazy';
                img.decoding = 'async';
                img.alt = item.file_name || '图片';

            });

            const title = document.createElement('strong');
            title.textContent = `${groupItems.length} 张图片`;

            meta.appendChild(hint);

            summary.appendChild(stack);
            summary.appendChild(meta);

            container.appendChild(grid);
            return container;

        function toggleImageGroupExpanded(messageEl) {
            const id = Number(messageEl.dataset.messageId);
            if (!Number.isInteger(id) || id <= 0) return;
            const next = !expandedImageGroupIds.has(id);
            if (next) expandedImageGroupIds.add(id); else expandedImageGroupIds.delete(id);

            const group = messageEl.querySelector('.image-group');
            if (group) group.classList.toggle('expanded', next);
            const summary = messageEl.querySelector('.image-group-summary');
            if (summary) {
                summary.setAttribute('aria-expanded', String(next));
                const hint = summary.querySelector('.image-group-hint');
                if (hint) hint.textContent = next ? '点击收起' : '点击展开 / 逐张查看';
            }
            const toggleBtn = messageEl.querySelector('.toggle-group-action');
            if (toggleBtn) updateImageGroupToggleAction(toggleBtn, next);
        }

        // === Favorites ===
        async function fetchFavorites() {
            try {
                const res = await fetch('/api/favorites');
                if (!res.ok) throw new Error('Failed');
                const rows = await res.json();
                setFavorites(Array.isArray(rows) ? rows : []);
            } catch (error) {
                console.error('加载收藏失败', error);
                favorites = [];
                favoritesBySourceId = new Map();

        function setFavorites(next) {
            favorites = next;
            favoritesBySourceId = new Map(
                favorites
                    .map((f) => [Number(f.source_message_id), f])

            renderFavorites();
            refreshFavoriteActions();

        function buildFavoritePreview(content) {
            const normalized = String(content || '').replace(/\s+/g, ' ').trim();
            if (!normalized) return { title: '空文本', body: '' };

            const titleMatch = normalized.match(/^标题[：:]\s*(.*?)(?:\s+正文[：:]|$)/);
            const bodyMatch = normalized.match(/正文[：:]\s*([\s\S]*)$/);
            const title = (titleMatch?.[1] || normalized.slice(0, 36)).trim();
            const body = (bodyMatch?.[1] || (titleMatch ? normalized.replace(title, '') : normalized.slice(36))).trim();

            return {
                title: title || '收藏文本',
                body: body || normalized
            };
        }
        function renderFavorites() {
            favoritesList.innerHTML = '';
            favoritesCount.textContent = String(favorites.length);
            favoritesCount.hidden = favorites.length === 0;
            favoritesEmpty.style.display = favorites.length ? 'none' : 'block';

            favorites.forEach((favorite) => {

        // === Send / Upload ===
        function emitTextMessage(rawText) {
            purgeExpiredLocalActions();
            pendingLocalActions.push({ kind: 'text', content: rawText, createdAt: Date.now() });
            socket.emit('chat message', rawText);
        }
        function sendMessage() {
            const rawText = messageInput.value;
            if (!rawText.trim()) return;
            emitTextMessage(rawText);
            messageInput.value = '';
            autoResize(messageInput);
            updateSendBtnState();
        }
        function buildImageGroupContent(count) { return `[图片组] ${count} 张图片`; }
        function uploadFile(input) {
            const files = Array.from(input.files || []);
            if (!files.length) return;
            input.value = '';
            enqueueUploads(files);
        }
        function enqueueUploads(files) {
            const normalized = files.map((f, i) => normalizeUploadFile(f, i)).filter(Boolean);
            if (!normalized.length) return;
            const imgs = normalized.filter(isImageFile);
            const mixed = imgs.length > 0 && imgs.length !== normalized.length;
            if (mixed) { showToast('图片和其他文件请分开发送'); return; }
            if (imgs.length > 1) {
                uploadQueue = uploadQueue.then(() => performImageGroupUpload(normalized));
                return;
            }
            normalized.forEach((file, i) => {
                uploadQueue = uploadQueue.then(() => performUpload(file, { index: i + 1, total: normalized.length }));
            });
        }
        function isImageFile(file) { return String(file?.type || '').startsWith('image/'); }
        function normalizeUploadFile(file, index = 0) {
            if (!file) return null;
            if (typeof file.name === 'string' && file.name.trim()) return file;
            const ext = inferFileExtension(file.type);
            const fallback = `clipboard-${formatFileStamp(new Date())}-${index + 1}.${ext}`;
            return new File([file], fallback, { type: file.type || 'application/octet-stream', lastModified: Date.now() });
        }
        function inferFileExtension(type) {
            if (!type) return 'bin';
            const [major, minorRaw] = type.split('/');
            const minor = (minorRaw || '').toLowerCase().split('+')[0];
            if (!minor) return major === 'image' ? 'png' : 'bin';
            if (minor === 'jpeg') return 'jpg';
            if (minor === 'svg+xml') return 'svg';
            return minor;
        }
        function formatFileStamp(date) {
            const pad = (v) => String(v).padStart(2, '0');
            return [date.getFullYear(), pad(date.getMonth() + 1), pad(date.getDate())].join('') +
                   '-' + [pad(date.getHours()), pad(date.getMinutes()), pad(date.getSeconds())].join('');
        }

        function extractClipboardFiles(event) {
            const cd = event.clipboardData;
            if (!cd) return [];
            const filesFromList = Array.from(cd.files || []).map((f, i) => normalizeUploadFile(f, i)).filter(Boolean);
            if (filesFromList.length) return filesFromList;
            return Array.from(cd.items || [])
                .filter((it) => it.kind === 'file')
                .map((it, i) => normalizeUploadFile(it.getAsFile(), i))
                .filter(Boolean);
        }
        function handlePasteUpload(event) {
            const files = extractClipboardFiles(event);
            if (!files.length) return;
            event.preventDefault();
            enqueueUploads(files);
        }

        function dataUrlToFile(dataUrl, fallbackName) {
            const m = String(dataUrl || '').match(/^data:([^;,]+)?(;base64)?,([\s\S]+)$/i);
            if (!m) return null;
            const mime = m[1] || 'application/octet-stream';
            const isB64 = Boolean(m[2]);
            const payload = m[3] || '';
            const binary = isB64 ? atob(payload) : decodeURIComponent(payload);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new File([bytes], fallbackName, { type: mime, lastModified: Date.now() });
        }
        function looksLikeFileReference(text) {
            const n = String(text || '').trim();
            if (!n || /\r|\n/.test(n) || /^https?:\/\//i.test(n)) return false;
            return /(^[a-zA-Z]:\\|^\/|[\\/]|\.)(png|jpe?g|gif|webp|bmp|svg|heic|mp4|mov|webm|pdf|zip|txt|docx?|xlsx?|pptx?)$/i.test(n);
        }
        async function extractClipboardPayloadFromApi() {
            if (typeof navigator.clipboard?.read !== 'function') return { files: [], hasRichContent: false };
            try {
                const items = await navigator.clipboard.read();
                const files = [];
                let hasRichContent = false;
                for (const item of items) {
                    for (const type of item.types) {
                        if (type.startsWith('image/')) {
                            const blob = await item.getType(type);
                            const fallback = `clipboard-${formatFileStamp(new Date())}-${files.length + 1}.${inferFileExtension(type)}`;
                            files.push(new File([blob], fallback, { type, lastModified: Date.now() }));
                            hasRichContent = true;
                            continue;
                        }
                        if (type === 'text/html') {
                            hasRichContent = true;
                            try {
                                const blob = await item.getType(type);
                                const html = await blob.text();
                                const doc = new DOMParser().parseFromString(html, 'text/html');
                                Array.from(doc.querySelectorAll('img[src^="data:image/"]')).forEach((node, i) => {
                                    const src = node.getAttribute('src') || '';
                                    const ext = inferFileExtension((src.match(/^data:([^;,]+)/i) || [])[1] || 'image/png');
                                    const fallback = `clipboard-${formatFileStamp(new Date())}-${files.length + i + 1}.${ext}`;
                                    const f = dataUrlToFile(src, fallback);
                                    if (f) files.push(f);
                                });
                            } catch (e) { console.warn('解析剪贴板 HTML 图片失败', e); }
                            continue;
                        }
                        if (type !== 'text/plain') hasRichContent = true;
                    }
                }
                return { files, hasRichContent };
            } catch (e) {
                console.warn('读取剪贴板富内容失败', e);
                return { files: [], hasRichContent: false };
            }
        }
        async function readClipboardTextFromApi() {
            if (typeof navigator.clipboard?.readText !== 'function') return '';
            try { return await navigator.clipboard.readText(); }
            catch (e) { console.warn('读取剪贴板文本失败', e); return ''; }
        }
        async function sendClipboardContent() {
            const { files: imgs, hasRichContent } = await extractClipboardPayloadFromApi();
            if (imgs.length) {
                enqueueUploads(imgs);
                showToast(imgs.length > 1 ? `已发送 ${imgs.length} 张剪贴板图片` : '已发送剪贴板图片');
                return;
            }
            const text = await readClipboardTextFromApi();
            if (text.trim()) {
                if (hasRichContent || looksLikeFileReference(text)) {
                    showToast('浏览器没有读取到图片内容，请直接粘贴或点 + 选择文件');
                    return;
                }
                emitTextMessage(text);
                showToast('已发送剪贴板文本');
                return;
            }
            showToast('剪贴板没有可发送的文本或图片');
        }

        function performUpload(file, queueInfo) {
            return new Promise((resolve) => {
                purgeExpiredLocalActions();
                pendingLocalActions.push({ kind: 'file', content: `[文件] ${file.name}`, fileType: file.type, createdAt: Date.now() });
                const formData = new FormData();
                formData.append('file', file);
                const totalBytes = file.size;
                showUploadProgress(file.name, totalBytes, queueInfo);
                const xhr = new XMLHttpRequest();
                currentXhr = xhr;
                xhr.open('POST', '/upload', true);
                const startTime = Date.now();
                xhr.upload.onprogress = (e) => {
                    updateUploadProgress(e.loaded, e.total || totalBytes, startTime);
                };
                xhr.upload.onabort = () => { hideUploadProgress(); resolve(); };
                xhr.onload = () => {
                    hideUploadProgress();
                    if (xhr.status === 200) {
                        try { const r = JSON.parse(xhr.responseText); if (r?.ip) rememberMyIp(r.ip); }
                        catch (e) { console.error('解析上传响应失败', e); }
                    } else {
                        showToast('上传失败');
                    }
                    resolve();
                };
                xhr.onerror = () => { hideUploadProgress(); showToast('上传出错'); resolve(); };
                xhr.send(formData);
            });
        }

        function performImageGroupUpload(files) {
            return new Promise((resolve) => {
                const content = buildImageGroupContent(files.length);
                purgeExpiredLocalActions();
                pendingLocalActions.push({ kind: 'image_group', content, groupCount: files.length, createdAt: Date.now() });
                const formData = new FormData();
                files.forEach((f) => formData.append('files', f));
                const totalBytes = files.reduce((s, f) => s + f.size, 0);
                showUploadProgress(`${files.length} 张图片`, totalBytes, null);
                const xhr = new XMLHttpRequest();
                currentXhr = xhr;
                xhr.open('POST', '/upload/images', true);
                const startTime = Date.now();
                xhr.upload.onprogress = (e) => {
                    updateUploadProgress(e.loaded, e.total || totalBytes, startTime);
                };
                xhr.upload.onabort = () => { hideUploadProgress(); resolve(); };
                xhr.onload = () => {
                    hideUploadProgress();
                    if (xhr.status === 200) {
                        try { const r = JSON.parse(xhr.responseText); if (r?.ip) rememberMyIp(r.ip); }
                        catch (e) { console.error('解析图片组上传响应失败', e); }
                    } else {
                        showToast('图片组上传失败');
                    }
                    resolve();
                };
                xhr.onerror = () => { hideUploadProgress(); showToast('图片组上传出错'); resolve(); };
                xhr.send(formData);
            });
        }

        // === Modal confirm ===
        let modalResolver = null;
        function openConfirm({ title, desc, danger = false, confirmText = '确认', cancelText = '取消' }) {
            modalTitle.textContent = title;
            modalDesc.textContent = desc;
            modalConfirm.textContent = confirmText;

            modalIcon.className = `modal-icon ${danger ? '' : 'info'}`;

        function closeConfirm(value) {

        progressCancel.addEventListener('click', () => {

        // === Misc helpers ===
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            const next = Math.min(textarea.scrollHeight, 200);
            textarea.style.height = Math.max(38, next) + 'px';
        }
        function updateSendBtnState() {
            sendBtn.disabled = !messageInput.value.trim();
        }
        const lightboxState = { items: [], index: 0 };
        function openLightbox(items, index) {
            lightboxState.items = items;
            lightboxState.index = index || 0;
            const item = items[lightboxState.index];
            lbImg.src = item.file_url;
            lbImg.alt = item.file_name || '';
            lbName.textContent = item.file_name || '';
            lbCounter.textContent = items.length > 1 ? `${lightboxState.index + 1} / ${items.length}` : '';
            const single = items.length <= 1;
            lbPrev.hidden = single;
            lbNext.hidden = single;
            lightboxEl.setAttribute('aria-hidden', 'false');
            lightboxEl.classList.add('visible');
        }
        function closeLightbox() {
            lightboxEl.classList.remove('visible');
            lightboxEl.setAttribute('aria-hidden', 'true');
            lbImg.src = '';
        }
        function lightboxStep(delta) {
            const { items } = lightboxState;
            if (!items.length) return;
            lightboxState.index = (lightboxState.index + delta + items.length) % items.length;
            const item = items[lightboxState.index];
            lbImg.src = item.file_url;
            lbImg.alt = item.file_name || '';
            lbName.textContent = item.file_name || '';
            lbCounter.textContent = `${lightboxState.index + 1} / ${items.length}`;
        }
        lbClose.addEventListener('click', closeLightbox);
        lbPrev.addEventListener('click', () => lightboxStep(-1));
        lbNext.addEventListener('click', () => lightboxStep(+1));
        lightboxEl.addEventListener('click', (e) => { if (e.target === lightboxEl) closeLightbox(); });

        function formatBytes(n) {
            if (n < 1024) return `${n} B`;
            if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
            if (n < 1024 * 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(1)} MB`;
            return `${(n / (1024 * 1024 * 1024)).toFixed(1)} GB`;
        }
        function updateUploadProgress(loaded, total, startTime) {
            const elapsed = (Date.now() - startTime) / 1000;
            const p = total > 0 ? Math.round((loaded / total) * 100) : 0;
            progressFill.style.width = p + '%';
            progressText.textContent = p + '%';
            progressBytes.textContent = `已传 ${formatBytes(loaded)} / ${formatBytes(total)}`;
            if (elapsed > 0 && loaded > 0) {
                const speed = loaded / elapsed;
                progressSpeed.textContent = `${formatBytes(Math.round(speed))}/s`;
                const remaining = total - loaded;
                const etaSec = speed > 0 ? Math.round(remaining / speed) : 0;
                progressEta.textContent = etaSec > 0 ? `剩余 ${etaSec}s` : '--';
            } else {
                progressSpeed.textContent = '';
                progressEta.textContent = '';
            }
        }
        function showUploadProgress(name, totalBytes, queueInfo) {
            const prefix = queueInfo ? `[${queueInfo.index}/${queueInfo.total}] ` : '';
            progressFile.textContent = `${prefix}正在上传 · ${name}`;
            progressText.textContent = '0%';
            progressFill.style.width = '0%';
            progressBytes.textContent = '';
            progressSpeed.textContent = '';
            progressEta.textContent = '';
            progressContainer.classList.add('visible');
        }
        function hideUploadProgress() {
            progressContainer.classList.remove('visible');
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            progressFile.textContent = '正在上传';
            progressBytes.textContent = '';
            progressSpeed.textContent = '';
            progressEta.textContent = '';
            currentXhr = null;
        }
        function wait(ms) { return new Promise((r) => window.setTimeout(r, ms)); }
        async function downloadFile(fileUrl, downloadName) {
            if (!fileUrl) return false;
            try {
                const res = await fetch(fileUrl);
                if (!res.ok) throw new Error('Failed');
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = downloadName || 'download';
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                link.remove();
                window.setTimeout(() => URL.revokeObjectURL(url), 1000);
                return true;
            } catch (e) { console.error('下载失败', e); return false; }
        }
        async function downloadGroupItems(items) {
            if (!Array.isArray(items) || !items.length) { showToast('当前没有可下载的图片'); return; }
            showToast(`开始下载 ${items.length} 张图片`);
            for (const item of items) {
                await downloadFile(item.file_url, item.file_name || 'image');
                await wait(120);
            }
        }
        async function copyText(text) {
            if (!text) return false;
            try {
                if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; }
            } catch (e) { /* fallback */ }
            return fallbackCopyText(text);
        }
        function fallbackCopyText(text) {
            const helper = document.createElement('textarea');
            helper.value = text;
            helper.setAttribute('readonly', '');
            helper.style.cssText = 'position:fixed;opacity:0;pointer-events:none;left:-9999px;';
            document.body.appendChild(helper);
            helper.focus();
            helper.select();
            let copied = false;
            try { copied = document.execCommand('copy'); } catch (e) {}
            helper.remove();
            return copied;
        }
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('visible');
            window.clearTimeout(toastTimer);
            toastTimer = window.setTimeout(() => toast.classList.remove('visible'), TOAST_MS);
        }
        function scrollToBottom(smooth = false) {
            if (!smooth || prefersReducedMotion() || isHistoryHydrating) {
                messagesDiv.style.scrollBehavior = 'auto';
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                requestAnimationFrame(() => {
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    requestAnimationFrame(() => { messagesDiv.style.scrollBehavior = ''; });
                });
                return;
            }
            requestAnimationFrame(() => {
                messagesDiv.scrollTo({ top: messagesDiv.scrollHeight, behavior: 'smooth' });
            });
        }
        function prefersReducedMotion() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
        function bindMediaAutoScroll(el, eventName, smooth = true) {
            const e = eventName || 'load';
            const ready = el.tagName === 'IMG' ? el.complete : el.readyState >= 1;
            if (ready) { scrollToBottom(smooth); return; }
            el.addEventListener(e, () => scrollToBottom(smooth), { once: true });
        }

        function rememberMyIp(ip) {
            if (!ip || myIp === ip) return;
            myIp = ip;
            localStorage.setItem(LOCAL_IP_KEY, ip);
            updateConnStatus(socket.connected);
            refreshOwnership();
        }

        function identifySelfFromEcho(msg) {
            purgeExpiredLocalActions();
            const t = getMessageType(msg);
            const expectedKind = t === 'image_group' ? 'image_group' : (t === 'file' ? 'file' : 'text');
            const idx = pendingLocalActions.findIndex((a) => {
                if (a.kind !== expectedKind) return false;
                if (a.content !== msg.content) return false;
                if (expectedKind === 'file' && a.fileType && msg.file_type) return a.fileType === msg.file_type;
                if (expectedKind === 'image_group') return Number(a.groupCount) === Number((msg.group_items || []).length);
                return true;
            });
            if (idx !== -1) {
                pendingLocalActions.splice(idx, 1);
                rememberMyIp(msg.ip);
            }
        }
        function purgeExpiredLocalActions() {
            const now = Date.now();
            while (pendingLocalActions.length && now - pendingLocalActions[0].createdAt > MAX_PENDING_AGE) {
                pendingLocalActions.shift();
            }
        }

        // === Drag & Drop ===
        function hasDraggedFiles(event) { return Array.from(event.dataTransfer?.types || []).includes('Files'); }
        function showDragOverlay() { dragOverlay.classList.add('active'); }
        function hideDragOverlay() { dragOverlay.classList.remove('active'); }

        window.addEventListener('dragenter', (event) => {
            if (!hasDraggedFiles(event)) return;
            event.preventDefault();
            dragDepth += 1;
            showDragOverlay();
        });
        window.addEventListener('dragover', (event) => {
            if (!hasDraggedFiles(event) && !dragOverlay.classList.contains('active')) return;
            event.preventDefault();
            if (hasDraggedFiles(event)) showDragOverlay();
        });
        window.addEventListener('dragleave', (event) => {
            if (!dragOverlay.classList.contains('active')) return;
            event.preventDefault();
            dragDepth = Math.max(0, dragDepth - 1);
            const left = event.clientX <= 0 || event.clientY <= 0 ||
                         event.clientX >= window.innerWidth || event.clientY >= window.innerHeight;
            if (dragDepth === 0 || left) { dragDepth = 0; hideDragOverlay(); }
        });
        window.addEventListener('drop', (event) => {
            if (!dragOverlay.classList.contains('active') && !hasDraggedFiles(event)) return;
            event.preventDefault();
            dragDepth = 0;
            hideDragOverlay();
            const files = Array.from(event.dataTransfer?.files || []);
            if (files.length) enqueueUploads(files);
        });

        // === Sidebar ===
        function isMobileLayout() { return window.matchMedia('(max-width: 960px)').matches; }
        function setSidebarOpen(open) {
            document.body.classList.toggle('sidebar-open', open);
            sidebar.setAttribute('aria-hidden', String(!open));
        }
        function setSidebarCollapsed(collapsed) {
            document.body.classList.toggle('sidebar-collapsed', collapsed);
            localStorage.setItem(SIDEBAR_COLLAPSED_KEY, collapsed ? '1' : '0');
            if (sidebarToggleBtn) {
                sidebarToggleBtn.setAttribute('aria-label', collapsed ? '展开侧栏' : '收起侧栏');
                sidebarToggleBtn.title = collapsed ? '展开侧栏' : '收起侧栏';
            }
        }
        menuBtn.addEventListener('click', () => {
            if (isMobileLayout()) {
                setSidebarOpen(!document.body.classList.contains('sidebar-open'));
            } else {
                setSidebarCollapsed(!document.body.classList.contains('sidebar-collapsed'));
            }
        });
        sidebarCloseBtn.addEventListener('click', () => setSidebarOpen(false));
        sidebarBackdrop.addEventListener('click', () => setSidebarOpen(false));
        if (sidebarToggleBtn) {
            sidebarToggleBtn.addEventListener('click', () => {
                if (isMobileLayout()) {
                    setSidebarOpen(false);
                } else {
                    setSidebarCollapsed(!document.body.classList.contains('sidebar-collapsed'));
                }
            });
        }

        // === Help FAB ===
        if (helpFab && helpPopover) {
            helpFab.addEventListener('click', (e) => {
                e.stopPropagation();
                helpPopover.classList.toggle('visible');
            });
            document.addEventListener('click', (e) => {
                if (!helpPopover.contains(e.target) && e.target !== helpFab) {
                    helpPopover.classList.remove('visible');
                }
            });
        }

        // === Theme ===
        function getResolvedTheme() {
            if (themePref === 'light' || themePref === 'dark') return themePref;
            return systemThemeQuery.matches ? 'dark' : 'light';
        }
        function updateThemeControls() {
            themeButtons.forEach((b) => {
                const active = b.dataset.themeOption === themePref;
                b.classList.toggle('active', active);
                b.setAttribute('aria-pressed', String(active));
            });
        }
        function applyThemePreference(pref) {
            const next = ['system', 'light', 'dark'].includes(pref) ? pref : 'system';
            themePref = next;
            if (next === 'system') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem(THEME_KEY, next);
            updateThemeControls();
        }
        themeButtons.forEach((b) => b.addEventListener('click', () => applyThemePreference(b.dataset.themeOption || 'system')));
        if (typeof systemThemeQuery.addEventListener === 'function') {
            systemThemeQuery.addEventListener('change', () => { if (themePref === 'system') updateThemeControls(); });
        } else if (typeof systemThemeQuery.addListener === 'function') {
            systemThemeQuery.addListener(() => { if (themePref === 'system') updateThemeControls(); });
        }

        // === Bindings ===
        fileInput.addEventListener('change', () => uploadFile(fileInput));
        clipboardSendBtn.addEventListener('click', sendClipboardContent);
        sendBtn.addEventListener('click', sendMessage);
        clearHistoryBtn.addEventListener('click', clearHistory);
        cleanupBtn.addEventListener('click', cleanupFiles);
        window.addEventListener('paste', handlePasteUpload);
        document.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse') return;
            if (event.target.closest?.('.msg-bubble-wrap')) return;
            clearTouchActions();
        }, { passive: true });

        messageInput.addEventListener('input', () => { autoResize(messageInput); updateSendBtnState(); });
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (lightboxEl.classList.contains('visible')) {
                if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); lightboxStep(-1); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); lightboxStep(+1); }
                return;
            }
            if (e.key === 'Escape') {
                if (modalRoot.classList.contains('visible')) closeConfirm(false);
                else if (helpPopover && helpPopover.classList.contains('visible')) helpPopover.classList.remove('visible');
                else if (document.body.classList.contains('sidebar-open')) setSidebarOpen(false);
            }
        });
        window.addEventListener('resize', () => {
            if (!isMobileLayout()) document.body.classList.remove('sidebar-open');
        });

        // === Init ===
        applyThemePreference(themePref);
        fetchFavorites();
        autoResize(messageInput);
        updateSendBtnState();
        updateConnStatus(socket.connected);
        updateTopbarStats();
        if (!isMobileLayout() && localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === '1') {
            setSidebarCollapsed(true);
        }
    </script>
</body>
</html>
