<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5b5bd6">
    <title>LAN-Drop-Chat · 局域网传输工作台</title>
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%235b5bd6'/><path d='M9 17.5l4.4 4.2L23 10' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* =========================================================
           LAN-Drop-Chat · Style B (Minimal / Linear-Vercel flavored)
           Single solid indigo brand, 1px borders, no glass, dense.
           ========================================================= */

        :root {
            color-scheme: light dark;

            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

            /* Brand — single solid indigo */
            --brand-1: #5b5bd6;
            --brand-1-hover: #4e4ec3;
            --brand-1-active: #4444b3;
            --brand-soft: rgba(91, 91, 214, 0.08);
            --brand-ring: rgba(91, 91, 214, 0.18);

            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #dc2626;
            --danger-soft: #fef2f2;

            /* Surfaces (light) */
            --bg-base: #ffffff;
            --bg-strong: #f6f6f7;
            --surface: #ffffff;
            --surface-muted: #fafafb;
            --surface-hover: #f4f4f5;
            --surface-active: #ececef;
            --surface-overlay: rgba(0, 0, 0, 0.4);

            --border: #ececef;
            --border-strong: #d4d4d8;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
            --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.22);

            --text-1: #0a0a0a;
            --text-2: #6e6e72;
            --text-3: #a1a1a8;
            --text-on-brand: #ffffff;

            --bubble-other: #ffffff;
            --bubble-other-border: #ececef;
            --bubble-self: #f5f5f7;
            --bubble-self-border: #ececef;
            --bubble-system-bg: #f4f4f5;
            --bubble-system-fg: #6e6e72;
            --bubble-hover-ring: #d4d4d8;

            --input-bg: #ffffff;
            --input-border: #d4d4d8;

            --chip-on-bg: #0a0a0a;
            --chip-on-fg: #ffffff;

            --online-bg: #f0fdf4;
            --online-fg: #15803d;
            --offline-bg: #fef2f2;
            --offline-fg: #b91c1c;

            --badge-bg: #ececef;
            --badge-fg: #3f3f46;
            --file-icon-bg: #f4f4f5;
            --file-icon-fg: #3f3f46;
            --scroll: #d4d4d8;
            --kbd-bg: #ffffff;

            --sidebar-w: 296px;
            --sidebar-w-collapsed: 64px;
            --topbar-h: 56px;

            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-pill: 999px;

            --fs-body: 13px;
            --fs-bubble: 14px;
            --fs-title: 17px;
            --fs-h-section: 11px;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-base: #0a0a0a;
                --bg-strong: #1a1a1a;
                --surface: #161616;
                --surface-muted: #0e0e10;
                --surface-hover: #1a1a1d;
                --surface-active: #232327;
                --surface-overlay: rgba(0, 0, 0, 0.6);

                --border: #1f1f23;
                --border-strong: #2e2e34;

                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
                --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.55);
                --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.7);
                --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.75);

                --text-1: #ededed;
                --text-2: #8e8e95;
                --text-3: #5a5a60;

                --bubble-other: #161616;
                --bubble-other-border: #1f1f23;
                --bubble-self: #1a1a1d;
                --bubble-self-border: #1f1f23;
                --bubble-system-bg: #161616;
                --bubble-system-fg: #8e8e95;
                --bubble-hover-ring: #2e2e34;

                --input-bg: #161616;
                --input-border: #2e2e34;

                --chip-on-bg: #ededed;
                --chip-on-fg: #0a0a0a;

                --online-bg: rgba(34, 197, 94, 0.15);
                --online-fg: #4ade80;
                --offline-bg: rgba(239, 68, 68, 0.12);
                --offline-fg: #f87171;

                --badge-bg: #232327;
                --badge-fg: #c4c4ca;
                --file-icon-bg: #1a1a1d;
                --file-icon-fg: #c4c4ca;
                --scroll: #2e2e34;
                --kbd-bg: #161616;

                --danger: #ef4444;
                --danger-soft: rgba(239, 68, 68, 0.12);
            }
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg-base: #ffffff;
            --bg-strong: #f6f6f7;
            --surface: #ffffff;
            --surface-muted: #fafafb;
            --surface-hover: #f4f4f5;
            --surface-active: #ececef;
            --surface-overlay: rgba(0, 0, 0, 0.4);
            --border: #ececef;
            --border-strong: #d4d4d8;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);
            --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.22);
            --text-1: #0a0a0a;
            --text-2: #6e6e72;
            --text-3: #a1a1a8;
            --bubble-other: #ffffff;
            --bubble-other-border: #ececef;
            --bubble-self: #f5f5f7;
            --bubble-self-border: #ececef;
            --bubble-system-bg: #f4f4f5;
            --bubble-system-fg: #6e6e72;
            --bubble-hover-ring: #d4d4d8;
            --input-bg: #ffffff;
            --input-border: #d4d4d8;
            --chip-on-bg: #0a0a0a;
            --chip-on-fg: #ffffff;
            --online-bg: #f0fdf4;
            --online-fg: #15803d;
            --offline-bg: #fef2f2;
            --offline-fg: #b91c1c;
            --badge-bg: #ececef;
            --badge-fg: #3f3f46;
            --file-icon-bg: #f4f4f5;
            --file-icon-fg: #3f3f46;
            --scroll: #d4d4d8;
            --kbd-bg: #ffffff;
            --danger: #dc2626;
            --danger-soft: #fef2f2;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --bg-base: #0a0a0a;
            --bg-strong: #1a1a1a;
            --surface: #161616;
            --surface-muted: #0e0e10;
            --surface-hover: #1a1a1d;
            --surface-active: #232327;
            --surface-overlay: rgba(0, 0, 0, 0.6);
            --border: #1f1f23;
            --border-strong: #2e2e34;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.55);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.7);
            --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.75);
            --text-1: #ededed;
            --text-2: #8e8e95;
            --text-3: #5a5a60;
            --bubble-other: #161616;
            --bubble-other-border: #1f1f23;
            --bubble-self: #1a1a1d;
            --bubble-self-border: #1f1f23;
            --bubble-system-bg: #161616;
            --bubble-system-fg: #8e8e95;
            --bubble-hover-ring: #2e2e34;
            --input-bg: #161616;
            --input-border: #2e2e34;
            --chip-on-bg: #ededed;
            --chip-on-fg: #0a0a0a;
            --online-bg: rgba(34, 197, 94, 0.15);
            --online-fg: #4ade80;
            --offline-bg: rgba(239, 68, 68, 0.12);
            --offline-fg: #f87171;
            --badge-bg: #232327;
            --badge-fg: #c4c4ca;
            --file-icon-bg: #1a1a1d;
            --file-icon-fg: #c4c4ca;
            --scroll: #2e2e34;
            --kbd-bg: #161616;
            --danger: #ef4444;
            --danger-soft: rgba(239, 68, 68, 0.12);
        }

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

        body {
            font-family: var(--font-sans);
            font-size: var(--fs-body);
            color: var(--text-1);
            background: var(--bg-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
            letter-spacing: -0.005em;
            position: relative;
        }

        button, textarea, input { font: inherit; color: inherit; }
        button { border: none; background: none; cursor: pointer; padding: 0; font-family: inherit; }
        button:focus { outline: none; }
        button:focus-visible {
            outline: 2px solid var(--brand-1);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }
        textarea { resize: none; }
        a { color: var(--brand-1); text-decoration: none; }
        a:hover { text-decoration: underline; }
        kbd {
            font-family: var(--font-mono);
            font-size: 10.5px;
            background: var(--kbd-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 5px;
            color: var(--text-2);
        }

        /* ============== Layout ============== */
        #app {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            grid-template-rows: var(--topbar-h) auto minmax(0, 1fr) auto;
            grid-template-areas:
                "side topbar"
                "side filter"
                "side stage"
                "side composer";
            background: var(--bg-base);
            transition: grid-template-columns .18s ease;
        }
        body.sidebar-collapsed #app {
            grid-template-columns: var(--sidebar-w-collapsed) 1fr;
        }

        /* ============== Sidebar ============== */
        #sidebar {
            grid-area: side;
            background: var(--surface-muted);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            transition: width .18s ease;
        }

        .sidebar-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 14px 10px;
            flex-shrink: 0;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .brand-logo {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-md);
            background: var(--brand-1);
            color: #fff;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        .brand-logo svg { width: 16px; height: 16px; }
        .brand-text { min-width: 0; flex: 1; }
        .brand-text h1 {
            margin: 0;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-1);
        }

        #sidebar-close,
        #sidebar-toggle {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            color: var(--text-2);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            transition: background .12s, color .12s;
        }
        #sidebar-close svg, #sidebar-toggle svg { width: 16px; height: 16px; }
        #sidebar-close:hover,
        #sidebar-toggle:hover { background: var(--surface-hover); color: var(--text-1); }
        #sidebar-close { display: none; }
        body.sidebar-collapsed #sidebar-toggle svg { transform: rotate(180deg); }

        .sidebar-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scrollbar-width: thin;
            scrollbar-color: var(--scroll) transparent;
        }
        .sidebar-body::-webkit-scrollbar { width: 6px; }
        .sidebar-body::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }
        .sidebar-body::-webkit-scrollbar-track { background: transparent; }

        .sidebar-section { display: flex; flex-direction: column; gap: 8px; }

        .section-title {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 6px;
            font-size: var(--fs-h-section);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-3);
        }
        .section-title > span:first-child { flex: 1; }

        .badge {
            min-width: 18px;
            height: 16px;
            padding: 0 5px;
            border-radius: var(--radius-pill);
            background: var(--badge-bg);
            color: var(--badge-fg);
            font-size: 10px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .badge[hidden] { display: none; }

        /* Conn card */
        .conn-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color .12s, background .12s;
        }
        .conn-card.offline {
            border-color: var(--danger);
            background: var(--danger-soft);
        }
        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }
        .conn-card.offline .conn-dot,
        .top-pill.offline .conn-dot {
            background: var(--danger);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.18);
        }
        .conn-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
            line-height: 1.35;
        }
        .conn-info strong {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-1);
            margin-bottom: 1px;
        }
        .conn-card.offline .conn-info strong { color: var(--danger); }
        .conn-info span {
            font-size: 11px;
            color: var(--text-2);
            font-family: var(--font-mono);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Theme switch */
        .theme-switch {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 3px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }
        .theme-option {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 4px;
            border-radius: var(--radius-sm);
            color: var(--text-2);
            font-size: 11.5px;
            font-weight: 500;
            transition: background .12s, color .12s;
        }
        .theme-option svg { width: 13px; height: 13px; }
        .theme-option:hover { color: var(--text-1); }
        .theme-option.active {
            background: var(--surface-active);
            color: var(--text-1);
            box-shadow: var(--shadow-sm), 0 0 0 1px var(--border);
        }

        /* Favorites */
        .favorite-empty {
            margin: 0;
            padding: 12px;
            font-size: 12px;
            color: var(--text-3);
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            line-height: 1.5;
        }
        .favorites-list { display: flex; flex-direction: column; gap: 4px; }
        .favorite-item { position: relative; }
        .favorite-card {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: left;
            transition: background .12s, border-color .12s;
        }
        .favorite-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-strong);
        }
        .favorite-card-title {
            font-size: 11px;
            color: var(--text-3);
            font-family: var(--font-mono);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .favorite-card-body {
            font-size: 12.5px;
            color: var(--text-1);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }
        .favorite-delete {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            border-radius: var(--radius-sm);
            color: var(--text-3);
            display: grid;
            place-items: center;
            opacity: 0;
            transition: opacity .12s, background .12s, color .12s;
        }
        .favorite-delete svg { width: 12px; height: 12px; }
        .favorite-item:hover .favorite-delete { opacity: 1; }
        .favorite-delete:hover {
            background: var(--surface-active);
            color: var(--danger);
        }

        /* Side actions */
        .sb-action {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-2);
            font-size: 12.5px;
            text-align: left;
            transition: background .12s, border-color .12s, color .12s;
        }
        .sb-action svg { width: 14px; height: 14px; flex-shrink: 0; }
        .sb-action:hover { background: var(--surface-hover); color: var(--text-1); }
        .sb-action.danger:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: var(--danger-soft);
        }

        #sidebar-backdrop { display: none; }

        /* Collapsed sidebar */
        body.sidebar-collapsed .brand-text,
        body.sidebar-collapsed .conn-info,
        body.sidebar-collapsed .section-title,
        body.sidebar-collapsed .theme-option > span,
        body.sidebar-collapsed .favorite-empty,
        body.sidebar-collapsed .favorite-card,
        body.sidebar-collapsed .favorite-delete,
        body.sidebar-collapsed .sb-action > span:not(.icon) {
            display: none !important;
        }
        body.sidebar-collapsed .sidebar-head { justify-content: center; padding: 14px 6px 10px; }
        body.sidebar-collapsed .brand { justify-content: center; }
        body.sidebar-collapsed .sidebar-body { padding: 0 8px 16px; align-items: center; }
        body.sidebar-collapsed .sidebar-section { align-items: center; width: 100%; }
        body.sidebar-collapsed .conn-card { padding: 8px; justify-content: center; }
        body.sidebar-collapsed .theme-switch { grid-template-columns: 1fr; gap: 2px; width: 100%; }
        body.sidebar-collapsed .theme-option { padding: 8px 4px; }
        body.sidebar-collapsed .favorites-list { display: none; }
        body.sidebar-collapsed .sb-action {
            justify-content: center;
            padding: 8px;
            width: 100%;
        }

        /* ============== Topbar ============== */
        .topbar {
            grid-area: topbar;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 22px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-base);
            height: var(--topbar-h);
            z-index: 4;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }
        #menu-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            color: var(--text-1);
            display: none;
            place-items: center;
            flex-shrink: 0;
        }
        #menu-btn svg { width: 18px; height: 18px; }
        #menu-btn:hover { background: var(--surface-hover); }

        .topbar-title {
            display: flex;
            flex-direction: column;
            min-width: 0;
            line-height: 1.2;
        }
        .topbar-title h2 {
            margin: 0;
            font-size: var(--fs-title);
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-1);
        }
        .topbar-title p {
            margin: 1px 0 0;
            font-size: 12px;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-actions { display: flex; align-items: center; gap: 8px; }
        .top-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            background: var(--online-bg);
            color: var(--online-fg);
            font-size: 11.5px;
            font-weight: 500;
        }
        .top-pill.offline {
            background: var(--offline-bg);
            color: var(--offline-fg);
        }

        /* ============== Filter chips ============== */
        .filter-bar {
            grid-area: filter;
            display: flex;
            gap: 6px;
            padding: 10px 22px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-base);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            border-radius: var(--radius-pill);
            padding: 5px 12px;
            font-size: 12.5px;
            font-weight: 500;
            white-space: nowrap;
            transition: background .12s, color .12s, border-color .12s;
        }
        .filter-chip:hover { color: var(--text-1); }
        .filter-chip.active {
            background: var(--chip-on-bg);
            color: var(--chip-on-fg);
            border-color: var(--chip-on-bg);
        }

        /* ============== Chat stage ============== */
        #chat-stage {
            grid-area: stage;
            overflow: hidden;
            min-height: 0;
        }
        #messages {
            height: 100%;
            overflow-y: auto;
            padding: 14px 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: var(--scroll) transparent;
        }
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 3px; }

        .day-separator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0 4px;
            color: var(--text-3);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .day-separator::before,
        .day-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .empty-state {
            align-self: center;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-3);
            padding: 32px 16px;
            text-align: center;
            max-width: 360px;
        }
        .empty-state-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            background: var(--surface);
            border: 1px dashed var(--border-strong);
            display: grid;
            place-items: center;
            color: var(--text-3);
        }
        .empty-state-icon svg { width: 26px; height: 26px; }
        .empty-state h3 {
            margin: 8px 0 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-1);
        }
        .empty-state p {
            margin: 0;
            font-size: 12.5px;
            line-height: 1.55;
            color: var(--text-2);
        }

        /* ============== Message ============== */
        .message {
            display: flex;
            gap: 10px;
            max-width: 100%;
            align-items: flex-start;
        }
        .message.self { flex-direction: row-reverse; }
        .message.system {
            display: flex;
            justify-content: center;
            margin: 4px 0;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            color: #fff;
        }
        .msg-avatar svg { width: 16px; height: 16px; }
        .message.system .msg-avatar { display: none; }

        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-width: min(560px, calc(100% - 60px));
            min-width: 0;
        }
        .message.self .msg-body { align-items: flex-end; }
        .message.system .msg-body { max-width: 100%; align-items: center; }

        .msg-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-3);
            padding: 0 4px;
            line-height: 1.2;
        }
        .msg-info strong {
            font-weight: 500;
            color: var(--text-2);
            font-family: var(--font-mono);
        }
        .msg-info span { font-variant-numeric: tabular-nums; }

        .msg-bubble-wrap {
            position: relative;
            display: inline-flex;
            min-width: 0;
        }

        .msg-bubble {
            position: relative;
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            background: var(--bubble-other);
            color: var(--text-1);
            font-size: var(--fs-bubble);
            line-height: 1.5;
            word-wrap: break-word;
            word-break: break-word;
            border: 1px solid var(--bubble-other-border);
            max-width: 100%;
            transition: border-color .12s, box-shadow .12s;
        }

        .message.self .msg-bubble {
            background: var(--bubble-self);
            border-color: var(--bubble-self-border);
            border-radius: 4px var(--radius-lg) var(--radius-lg) 4px;
            padding-left: 16px;
        }
        .message.self .msg-bubble::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: var(--brand-1);
            border-radius: 2px;
        }

        .message.system .msg-bubble {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: var(--bubble-system-bg);
            color: var(--bubble-system-fg);
            border: none;
            border-radius: var(--radius-pill);
            font-size: 11.5px;
            line-height: 1.4;
        }

        .message.other .msg-bubble:not(.media-bubble),
        .message.self .msg-bubble:not(.media-bubble) { cursor: pointer; }
        .message.other .msg-bubble:not(.media-bubble):hover,
        .message.self .msg-bubble:not(.media-bubble):hover {
            box-shadow: 0 0 0 1px var(--bubble-hover-ring);
        }
        .message.system .msg-bubble { cursor: default; box-shadow: none !important; }

        .msg-bubble.media-bubble {
            padding: 4px;
            background: var(--bubble-other);
            border-color: var(--bubble-other-border);
            cursor: default;
        }
        .message.self .msg-bubble.media-bubble { padding-left: 7px; }
        /* 单图：固定 4:3 预览窗口，超出部分裁剪，点击进 lightbox 看原图
           只匹配 bubble 直接子级，不影响图片组内部 */
        .msg-bubble.media-bubble > img {
            display: block;
            width: 360px;
            max-width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            object-position: center;
            border-radius: var(--radius-md);
            cursor: pointer;
            background: var(--surface-hover);
        }
        /* 视频：固定 16:9 预览窗口，黑底居中，原生 controls 可用 */
        .msg-bubble.media-bubble > video {
            display: block;
            width: 360px;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            border-radius: var(--radius-md);
            background: #000;
            outline: none;
        }
        .msg-bubble.media-bubble:hover { box-shadow: none; }
        @media (max-width: 960px) {
            .msg-bubble.media-bubble > img,
            .msg-bubble.media-bubble > video {
                width: 100%;
            }
        }

        .msg-text { white-space: pre-wrap; word-break: break-word; }
        .text-collapse { position: relative; }
        .text-collapse.collapsed {
            max-height: 11.5em;
            overflow: hidden;
        }
        .text-collapse.collapsed::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 3em;
            background: linear-gradient(to bottom, transparent, var(--bubble-other));
            pointer-events: none;
        }
        .message.self .text-collapse.collapsed::after {
            background: linear-gradient(to bottom, transparent, var(--bubble-self));
        }
        .text-expand-toggle {
            display: inline-block;
            margin-top: 6px;
            border: 0;
            background: transparent;
            color: var(--brand-1);
            font-size: 12.5px;
            font-weight: 500;
            padding: 0;
            cursor: pointer;
        }
        .text-expand-toggle:hover { color: var(--brand-1-hover); text-decoration: underline; }

        /* File card (generic) */
        .file-card {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 240px;
            padding: 2px 4px;
            text-decoration: none;
            color: inherit;
        }
        .file-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: var(--radius-md);
            background: var(--file-icon-bg);
            color: var(--file-icon-fg);
            display: grid;
            place-items: center;
        }
        .file-icon svg { width: 18px; height: 18px; }
        .file-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .file-name {
            font-weight: 500;
            font-size: 13.5px;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-meta { font-size: 11px; color: var(--text-2); }

        /* Image group */
        .image-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .image-group-summary {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 6px 4px;
            border: 0;
            background: transparent;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }
        .image-group-stack {
            position: relative;
            width: 108px;
            height: 72px;
            flex-shrink: 0;
        }
        .image-group-stack img {
            position: absolute;
            width: 72px;
            height: 56px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            border: 2px solid var(--bubble-other);
            background: var(--surface-hover);
            box-shadow: var(--shadow-sm);
        }
        .image-group-stack img:nth-child(1) { left: 0; top: 10px; transform: rotate(-4deg); }
        .image-group-stack img:nth-child(2) { left: 14px; top: 4px; transform: rotate(1deg); z-index: 2; }
        .image-group-stack img:nth-child(3) { left: 30px; top: 0; transform: rotate(5deg); z-index: 3; }
        .image-group-count {
            position: absolute;
            right: -8px;
            bottom: -4px;
            background: var(--brand-1);
            color: #fff;
            font-size: 10.5px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
            z-index: 4;
            box-shadow: 0 0 0 2px var(--bubble-other);
        }
        .message.self .image-group-count { box-shadow: 0 0 0 2px var(--bubble-self); }

        .image-group-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .image-group-meta strong {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-1);
        }
        .image-group-hint {
            font-size: 11.5px;
            color: var(--text-2);
        }

        .image-group-grid {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            max-width: 360px;
        }
        .image-group.expanded .image-group-grid { display: grid; }
        .image-group.expanded .image-group-summary { padding-bottom: 0; }
        .image-group-grid img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: var(--radius-sm);
            cursor: pointer;
            background: var(--surface-hover);
            transition: transform .15s;
        }
        .image-group-grid img:hover { transform: scale(0.98); }

        /* Hover toolbar */
        .msg-actions {
            position: absolute;
            top: -14px;
            right: 8px;
            display: flex;
            gap: 1px;
            padding: 2px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s;
            z-index: 2;
        }
        .message.self .msg-actions { right: auto; left: 8px; }
        .msg-bubble-wrap:hover .msg-actions,
        .msg-actions.touch-visible {
            opacity: 1;
            pointer-events: auto;
        }
        .msg-action {
            width: 24px;
            height: 24px;
            border: 0;
            background: transparent;
            color: var(--text-2);
            display: grid;
            place-items: center;
            border-radius: var(--radius-sm);
            transition: background .12s, color .12s;
        }
        .msg-action svg { width: 13px; height: 13px; }
        .msg-action:hover { background: var(--surface-hover); color: var(--text-1); }
        .msg-action.delete-action:hover { color: var(--danger); }
        .msg-action.favorite-action.active { color: var(--warning); }

        /* ============== Composer ============== */
        .composer-wrap {
            grid-area: composer;
            background: var(--bg-base);
            border-top: 1px solid var(--border);
            padding: 12px 22px calc(12px + var(--safe-bottom));
            position: relative;
        }

        #upload-progress {
            display: none;
            flex-direction: column;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-md);
        }
        #upload-progress.visible { display: flex; }
        .progress-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #progress-file {
            flex: 1;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #progress-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        #progress-cancel {
            width: 22px;
            height: 22px;
            border-radius: var(--radius-sm);
            color: var(--text-2);
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        #progress-cancel svg { width: 12px; height: 12px; }
        #progress-cancel:hover { background: var(--surface-hover); color: var(--danger); }
        .progress-detail {
            display: flex;
            gap: 14px;
            font-size: 11px;
            color: var(--text-2);
            font-variant-numeric: tabular-nums;
        }
        #progress-bar {
            height: 4px;
            background: var(--surface-active);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: var(--brand-1);
            border-radius: var(--radius-pill);
            transition: width .15s ease;
        }

        .composer {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: end;
            gap: 6px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            padding: 6px 8px;
            transition: border-color .15s, box-shadow .15s;
        }
        .composer:focus-within {
            border-color: var(--brand-1);
            box-shadow: 0 0 0 3px var(--brand-ring);
        }

        .composer-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            color: var(--text-2);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: background .12s, color .12s;
            flex-shrink: 0;
            align-self: end;
        }
        .composer-icon svg { width: 16px; height: 16px; }
        .composer-icon:hover { background: var(--surface-hover); color: var(--text-1); }

        #file-input { display: none; }

        #message-input {
            border: 0;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-1);
            line-height: 1.5;
            padding: 7px 4px;
            min-height: 32px;
            max-height: 200px;
            outline: none;
            width: 100%;
            resize: none;
        }
        #message-input::placeholder { color: var(--text-3); }

        .composer-send {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-md);
            background: var(--brand-1);
            color: var(--text-on-brand);
            display: grid;
            place-items: center;
            align-self: end;
            transition: background .12s, transform .08s, opacity .12s;
            flex-shrink: 0;
        }
        .composer-send svg { width: 16px; height: 16px; }
        .composer-send:hover:not(:disabled) { background: var(--brand-1-hover); }
        .composer-send:active:not(:disabled) {
            transform: scale(0.96);
            background: var(--brand-1-active);
        }
        .composer-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ============== Drag overlay ============== */
        #drag-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--surface-overlay);
            z-index: 60;
            pointer-events: none;
        }
        #drag-overlay.active { display: flex; }
        .drag-card {
            background: var(--surface);
            border: 1px dashed var(--brand-1);
            border-radius: var(--radius-lg);
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-1);
            box-shadow: var(--shadow-lg);
            max-width: 320px;
            text-align: center;
        }
        .drag-card-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            background: var(--brand-soft);
            color: var(--brand-1);
            display: grid;
            place-items: center;
        }
        .drag-card-icon svg { width: 22px; height: 22px; }
        .drag-card strong { font-size: 14px; font-weight: 600; }
        .drag-card span { font-size: 12px; color: var(--text-2); }

        /* ============== Toast ============== */
        #toast {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-12px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--brand-1);
            color: var(--text-1);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            pointer-events: none;
            transition: opacity .16s, transform .16s;
            z-index: 80;
            max-width: calc(100vw - 40px);
        }
        #toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============== Net banner ============== */
        .net-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--danger);
            color: #fff;
            padding: 7px 18px;
            font-size: 12.5px;
            font-weight: 500;
            text-align: center;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .net-banner[hidden] { display: none; }
        .net-banner svg { flex-shrink: 0; }

        /* ============== Help FAB & popover ============== */
        #help-fab {
            position: fixed;
            right: 22px;
            bottom: calc(100px + var(--safe-bottom));
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-2);
            display: grid;
            place-items: center;
            box-shadow: var(--shadow-md);
            z-index: 30;
            transition: background .12s, color .12s, transform .08s;
        }
        #help-fab:hover { background: var(--surface-hover); color: var(--text-1); }
        #help-fab:active { transform: scale(0.95); }
        #help-fab svg { width: 16px; height: 16px; }

        #help-popover {
            position: fixed;
            right: 22px;
            bottom: calc(146px + var(--safe-bottom));
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
            width: 240px;
            box-shadow: var(--shadow-lg);
            z-index: 40;
            font-size: 12.5px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(6px);
            transition: opacity .14s, transform .14s;
        }
        #help-popover.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .shortcut-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
            color: var(--text-2);
        }
        .shortcut-row + .shortcut-row { border-top: 1px solid var(--border); }
        .shortcut-row span:first-child {
            font-size: 12px;
            color: var(--text-1);
        }

        /* ============== Modal ============== */
        #modal-root {
            position: fixed;
            inset: 0;
            background: var(--surface-overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 90;
            padding: 20px;
        }
        #modal-root.visible { display: flex; }
        .modal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 380px;
            max-width: 100%;
            padding: 24px;
            box-shadow: var(--shadow-modal);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            background: var(--danger-soft);
            color: var(--danger);
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        .modal-icon.info {
            background: var(--brand-soft);
            color: var(--brand-1);
        }
        .modal-icon svg { width: 18px; height: 18px; }

        .modal-card h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-1);
        }
        .modal-card p {
            margin: 0;
            color: var(--text-2);
            font-size: 13px;
            line-height: 1.55;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 6px;
        }
        .btn {
            font-size: 13px;
            font-weight: 500;
            padding: 7px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-1);
            cursor: pointer;
            transition: background .12s, border-color .12s, color .12s;
        }
        .btn:hover { background: var(--surface-hover); }
        .btn-ghost { background: transparent; color: var(--text-2); }
        .btn-ghost:hover { background: var(--surface-hover); color: var(--text-1); }
        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #b91c1c;
            border-color: #b91c1c;
        }
        .btn-primary {
            background: var(--brand-1);
            border-color: var(--brand-1);
            color: var(--text-on-brand);
        }
        .btn-primary:hover {
            background: var(--brand-1-hover);
            border-color: var(--brand-1-hover);
        }

        /* ============== Lightbox ============== */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.92);

            align-items: center;
            justify-content: center;
            z-index: 95;
        }

        .lb-stage {
            max-width: 90vw;
            max-height: 80vh;
            display: grid;
            place-items: center;
        }
        #lb-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: var(--radius-sm);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            display: block;
        }
        .lb-close,
        .lb-prev,
        .lb-next {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            display: grid;
            place-items: center;
            transition: background .12s;
        }
        .lb-close { top: 18px; right: 18px; }
        .lb-prev { left: 24px; top: 50%; transform: translateY(-50%); }
        .lb-next { right: 24px; top: 50%; transform: translateY(-50%); }
        .lb-close:hover,
        .lb-prev:hover,
        .lb-next:hover { background: rgba(255, 255, 255, 0.18); }
        .lb-close svg,
        .lb-prev svg,
        .lb-next svg { width: 18px; height: 18px; }
        .lb-prev[hidden],
        .lb-next[hidden] { display: none; }
        .lb-meta {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.78);
            font-size: 12.5px;
            display: flex;
            gap: 10px;
            font-variant-numeric: tabular-nums;
            max-width: 80vw;
        }
        #lb-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60vw;
        }

        /* ============== Responsive (≤ 960px) ============== */
        @media (max-width: 960px) {
            #app {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "topbar"
                    "filter"
                    "stage"
                    "composer";
            }
            body.sidebar-collapsed #app { grid-template-columns: 1fr; }
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 280px;
                z-index: 70;
                transform: translateX(-100%);

            #sidebar-backdrop {
                display: none;

                inset: 0;

                z-index: 65;
            }
            body.sidebar-open #sidebar-backdrop { display: block; }
            #sidebar-close { display: grid; }
            #sidebar-toggle { display: none; }
            #menu-btn { display: grid; }

            .topbar { padding: 0 14px; }

            .composer-wrap { padding: 10px 14px calc(10px + var(--safe-bottom)); }
            .msg-body { max-width: calc(100% - 44px); }

            /* 触屏下消息操作按钮常显（避开 hover 依赖） */
            .msg-actions { opacity: 1; pointer-events: auto; }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        const socket = io();

        // === Constants & state ===

        const LOCAL_IP_KEY = 'lan-drop-chat-ip';
        const THEME_KEY = 'lan-drop-chat-theme-preference';
        const SIDEBAR_COLLAPSED_KEY = 'lan-drop-chat-sidebar-collapsed';

        const TOAST_MS = 1800;
        const LONG_TEXT_CHARS = 260;
        const LONG_TEXT_LINES = 8;

        let myIp = localStorage.getItem(LOCAL_IP_KEY) || '';
        let dragDepth = 0;
        let uploadQueue = Promise.resolve();

        let themePref = localStorage.getItem(THEME_KEY) || 'system';

        const pendingLocalActions = [];
        const systemThemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
        const touchActionsQuery = window.matchMedia('(hover: none)');

        // === Utility ===
        const ICON = {
            copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',

            starFill: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
